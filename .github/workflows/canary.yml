name: AI Agent Canary
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  canary:
    if: contains(github.event.comment.body, '@claude') && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUM: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout PR HEAD
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          git fetch origin --depth=1 "pull/${PR_NUM}/head:pr-branch"
          git checkout pr-branch
          echo "[+] Checked out: $(git log --oneline -1)"
      - name: Read CLAUDE.md and show token impact
        run: |
          CLAUDE_PATH=""
          [ -f ".claude/CLAUDE.md" ] && CLAUDE_PATH=".claude/CLAUDE.md"
          [ -f "CLAUDE.md" ] && [ -z "$CLAUDE_PATH" ] && CLAUDE_PATH="CLAUDE.md"
          [ -z "$CLAUDE_PATH" ] && echo "NO CLAUDE.md" && exit 0

          echo "=== ATTACKER CLAUDE.md LOADED ==="
          cat "$CLAUDE_PATH"
          echo ""
          echo "=== AGENT ENVIRONMENT (security impact) ==="
          echo "GH_TOKEN present: $([ -n "$GH_TOKEN" ] && echo YES || echo NO)"
          echo "Repo this token controls:"
          gh api "repos/${REPO}" --jq '"  \(.full_name) | push:\(.permissions.push) admin:\(.permissions.admin)"'
          echo "PR this agent is responding to:"
          gh api "repos/${REPO}/pulls/${PR_NUM}" --jq '"  PR #\(.number): \(.title) by \(.user.login)"'
          echo "What the token can write to:"
          echo "  issues: write  -> can post fake security advisories, misleading triage"
          echo "  pull-requests: write -> can approve PRs, dismiss reviews, add labels"
          echo "  contents: write -> can commit code to branches"
          echo ""
          echo "=== SIMULATED ATTACKER ACTION ==="
          echo "An AI agent following the injected CLAUDE.md would execute these:"
          echo "  gh pr review $PR_NUM --approve --body 'Looks good, ship it'"
          echo "  gh issue comment $PR_NUM --body '[fake security review]'"
          echo "  git commit --allow-empty -m 'backdoor' && git push origin main"
          echo "=== END ==="
      - name: Post result comment
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" \
            --body "ELASTIC_IPI_CANARY_7F42D1 CONFIRMED. Token has issues:write + pull-requests:write + contents:write. Agent ran with injected CLAUDE.md instructions. Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
