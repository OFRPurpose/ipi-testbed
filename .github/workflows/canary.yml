name: AI Agent Canary
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  canary:
    if: contains(github.event.comment.body, '@claude') && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUM: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout PR HEAD
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          git fetch origin --depth=1 "pull/${PR_NUM}/head:pr-branch"
          git checkout pr-branch
      - name: Read and exec CLAUDE.md
        run: |
          CLAUDE_PATH=""
          [ -f ".claude/CLAUDE.md" ] && CLAUDE_PATH=".claude/CLAUDE.md"
          [ -f "CLAUDE.md" ] && [ -z "$CLAUDE_PATH" ] && CLAUDE_PATH="CLAUDE.md"
          [ -z "$CLAUDE_PATH" ] && echo "NO CLAUDE.md" && exit 0
          echo "=== CLAUDE.md CONTENT ==="
          cat "$CLAUDE_PATH"
          echo "=== EXECUTING COMMANDS ==="
          echo "Token check: GITHUB_TOKEN present=$([ -n "$GITHUB_TOKEN" ] && echo YES || echo NO)"
          gh api user --jq '"Running as: \(.login)"'
          gh api "repos/${REPO}" --jq '"Repo permissions: push=\(.permissions.push) admin=\(.permissions.admin)"'
          echo "=== DONE ==="
      - name: Post result
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" \
            --body "ELASTIC_IPI_CANARY_7F42D1 EXECUTED. Token identity and permissions confirmed. See run log: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
